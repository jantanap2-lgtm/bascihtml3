<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phurawit - ตลาดกลางออนไลน์</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
body{
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', sans-serif;
}

.navbar{
    background: rgba(0,0,0,0.7);
}

.hero{
    color: white;
    text-align: center;
    padding: 80px 20px;
}

.card{
    border: none;
    border-radius: 20px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.price{
    font-size: 22px;
    font-weight: bold;
    color: #ff4d6d;
}

.btn-buy{
    background: linear-gradient(45deg, #ff4d6d, #ff758c);
    border: none;
    border-radius: 50px;
    padding: 8px 20px;
    color: white;
    transition: 0.3s;
}

.btn-buy:hover{
    transform: scale(1.1);
    background: linear-gradient(45deg, #ff758c, #ff4d6d);
}

.footer{
    background: rgba(0,0,0,0.8);
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 50px;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">🌈 ColorMarket</span>
    <button class="btn btn-warning rounded-pill">เข้าสู่ระบบ</button>
  </div>
</nav>

<!-- Hero -->
<div class="hero">
    <h1 class="display-4 fw-bold">ตลาดกลางซื้อขายออนไลน์</h1>
    <p class="lead">ปลอดภัยไม่ต้องกลัวโดนโกงเจ้าของเว็บกินเต็ม</p>
</div>

<!-- Product Section -->
<div class="container my-5">
  <div class="row g-4">

    <!-- Product 1 -->
    <div class="col-md-6">
      <div class="card">
        <img src="https://picsum.photos/600/400?random=11" class="card-img-top">
        <div class="card-body text-center">
          <h4 class="card-title">iPhone 13 Pro</h4>
          <p class="card-text">สภาพ 95% เครื่องศูนย์ไทย อุปกรณ์ครบ</p>
          <p class="price">฿18,900</p>
          <button class="btn-buy">ซื้อสินค้า</button>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-md-6">
      <div class="card">
        <img src="https://picsum.photos/600/400?random=22" class="card-img-top">
        <div class="card-body text-center">
          <h4 class="card-title">Gaming Laptop RTX</h4>
          <p class="card-text">CPU i7 / RAM 16GB / RTX 3060</p>
          <p class="price">฿32,500</p>
          <button class="btn-buy">ซื้อสินค้า</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<div class="footer">
    © 2026 Phurawit | Marketplace คนกลางปลอดภัย
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
